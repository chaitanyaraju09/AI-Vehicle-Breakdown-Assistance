name: vehicle_user_app
description: "Premium Vehicle Assistance User App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Premium typography
  google_fonts: ^8.2.1

  # API communication
  http: ^1.6.0

  # Secure authentication/token storage
  flutter_secure_storage: ^11.2.0

  # State management
  provider: ^6.1.5+1

  # GPS / location
  geolocator: ^14.0.3

  # Maps
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true